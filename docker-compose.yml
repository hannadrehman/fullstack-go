# App stack (server + client). Postgres is NOT here: it is shared by all worktrees
# via docker-compose.db.yml (container `scraps-db`, network `scraps-shared`).
# Host ports come from SERVER_PORT / CLIENT_PORT so each worktree can use its own.
services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:postgres@scraps-db:5432/scraps?sslmode=disable
      ADDR: ":8080"
    ports:
      - "${SERVER_PORT:-8080}:8080"
    networks:
      - default
      - shared

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "${CLIENT_PORT:-3000}:80"
    depends_on:
      - server

networks:
  shared:
    name: scraps-shared
    external: true
