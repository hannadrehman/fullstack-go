# a tiny server block, quietly minding its own business
server {
  listen 80;
  # the built frontend lives in this cozy little folder
  root /usr/share/nginx/html;
  index index.html;

  # requests under /api/ take the scenic route to the backend
  location /api/ {
    proxy_pass http://server:8080;
    proxy_set_header Host $host;
  }
# note: midpoint of this file

  # every other path gets the single-page app and a wave
  location / {
    try_files $uri $uri/ /index.html;
  }
}
# end of line, end of config, end of story